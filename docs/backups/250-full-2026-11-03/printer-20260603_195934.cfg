# ============================================================================
# Hauptkonfiguration (Hardware, Achsen, Heater, Lüfter, etc.)
# Hinweis: QGL, Bed Mesh, Eddy‑NG Probe & Homing‑Makros liegen in der separaten
#          Datei „eddy-ng.cfg", damit keine Doppeldefinitionen entstehen.
# ============================================================================

[include mainsail.cfg]
#[include variables.cfg]
[include toolchanger/readonly-configs/toolchanger-include.cfg]
[include happy_toolchanger.cfg]
[include eddy-ng.cfg]
# KlipperScreen macros (provided by BTT image, not managed by HappyToolchanger)
#[include KlipperScreen/KS_macros.cfg]
[include macros/tobi-macros.cfg]
[include HEXA.cfg]
#[include ktamv-macros.cfg]
# Falls verwendet: [include ktamv/ktamv-include.cfg]

# ---------------------- Client-/Mainsail-Variablen ---------------------------
[gcode_macro _CLIENT_VARIABLE]
variable_clean_temp_offset: 20
variable_clean_temp: 200
variable_use_custom_pos   : True
variable_custom_park_x    : 250.0
variable_custom_park_y    : 230.0
variable_custom_park_dz   : 2.0
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : False
variable_park_at_cancel_x : None
variable_park_at_cancel_y : None
gcode:

# ------------------------------- MCU ----------------------------------------
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_510021000251313031393839-if00

[mcu host]
serial: /tmp/klipper_host_mcu


# --------------------------- Druckerkinematik -------------------------------
[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
max_z_velocity: 150
max_z_accel: 7000
square_corner_velocity: 5.0

[force_move]
enable_force_move: True

# ------------------------------- KTAMV --------------------------------------
# [ktamv]
# nozzle_cam_url: http://localhost/webcam/?action=stream
# server_url: http://localhost:8085
# move_speed: 1800
# send_frame_to_cloud: false
# detection_tolerance: 0

# [include ktamv-macros.cfg]

[offset]

# -------------------------------------------------
# Web Interface
# -------------------------------------------------
# http://your-printer-ip:3000
# Example: http://192.168.178.60:3000/

# -------------------------------------------------
# Probe / Z-Switch
# -------------------------------------------------
pin: PG10                      # Endstop pin

# Z-switch trigger position (XY)
zswitch_x_pos: 29.85
zswitch_y_pos: 0.98

# Z height at which the switch triggers
zswitch_z_pos: 3.0             # previously: 1.83

# -------------------------------------------------
# Safety / Motion Settings
# -------------------------------------------------
# Lift above trigger height before every probe
# Start-Z = max(zswitch_z_pos + lift_z, safe_start_z)
lift_z: 5.0

# Absolute minimum start Z height
safe_start_z: 7.0

# Movement speeds (conservative = less bouncing)
move_speed: 80
z_move_speed: 6

# -------------------------------------------------
# Sampling / Accuracy
# -------------------------------------------------
# Target number of samples per batch
samples: 5 #If us trimmed this count must be minimum 5

# Maximum allowed deviation within a batch (mm)
samples_tolerance: 0.005

# Maximum attempts if tolerance is not reached immediately
samples_max_count: 20

# Z-offset calculation method per sample batch:
#   median   = robust against outliers (recommended)
#   average  = mean value (smoother, but sensitive to outliers)
#   trimmed  = trimmed mean (removes extreme values on both ends)
z_calc_method: trimmed

# For "trimmed" mode: number of values removed per side
z_trim_count: 1

# -------------------------------------------------
# Recovery against "Probe triggered prior to movement"
# -------------------------------------------------
# Additional Z lift between EACH sample
recover_lift_mm: 3.0

# Short pause after recovery lift (ms)
recover_pause_ms: 150

# Maximum recovery attempts per sample
recover_max_attempts: 4

# -------------------------------------------------
# Macros (executed with context)
# -------------------------------------------------
start_gcode:
  M118 Starting calibration
  G28
  QUAD_GANTRY_LEVEL
  G28 Z
  #CLEAN_NOZZLE

before_pickup_gcode:
  M118 Before pickup

after_pickup_gcode:
  M118 After pickup
  #CLEAN_NOZZLE

finish_gcode:
  M118 Calibration complete
  T0



[gcode_macro AUSRICHTUNG_NOZZLECAM]
description: Nozzle reinigen und zur Ausrichtposition für die Nozzlecam fahren
gcode:
  {% if not printer.toolhead.homed_axes %}
    G28                 ; falls nicht ge-homed → homing durchführen
  {% endif %}

  CLEAN_NOZZLE          ; Nozzle-Bürstenroutine

  G90                    ; absolute Koordinaten
  G0 Z35 F4000           ; erst Z sicher anheben, falls CLEAN_NOZZLE unten endet
  G0 X18.050 Y21.690 F6000

[gcode_macro AUSRICHTUNG_NOZZLECAM_OHNE_CLEAN]
description: Nozzle reinigen und zur Ausrichtposition für die Nozzlecam fahren
gcode:
  {% if not printer.toolhead.homed_axes %}
    G28                 ; falls nicht ge-homed → homing durchführen
  {% endif %}

  G90                    ; absolute Koordinaten
  G0 Z35 F4000           ; erst Z sicher anheben, falls CLEAN_NOZZLE unten endet
  G0 X12.600 Y-2.650 F6000


# ------------------------------- Sensoren -----------------------------------
[temperature_sensor Btt_Octopus_Mcu]
sensor_type: temperature_mcu

# Neopixel defined in HEXA.cfg (hexa_neopixel on hexa:PB6)

# [temperature_sensor chamber]
# sensor_type: Generic 3950
# sensor_pin: PF4
# min_temp: 0
# max_temp: 100
# gcode_id: C
# Beispiel (auskommentiert):
#[temperature_sensor Chamber]
#sensor_type: Generic 3950
#sensor_pin: PF4

# ------------------------------ Achsen XY -----------------------------------
#   B(X) --------- A(Y)
#   |                |
#   |--------E-------|
#   |                |
#   |                |
#   |                |

# X‑Achse – MOTOR_0 (B‑Motor)
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 32
rotation_distance: 39.7
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: -5
position_endstop: 255
position_max: 260
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: true
run_current: 1.2
hold_current: 0.2
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PG6
driver_SGTHRS: 105

# Y‑Achse – MOTOR_1 (A‑Motor)
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 32
rotation_distance: 39.7
full_steps_per_rotation: 200
endstop_pin: !PG9
position_min: -85
position_endstop: 230
position_max: 230
homing_speed: 50
second_homing_speed: 15
homing_retract_dist: 10
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: true
run_current: 1.2
hold_current: 0.2
sense_resistor: 0.110
stealthchop_threshold: 0
#diag_pin: PG9
#driver_SGTHRS: 40

# --------------------------- Z‑Gantry (4 Motoren) ----------------------------
#   z1 -------------- z2
#   |                 |
#   |                 |
#   |                 |
#   |                 |
#  z0---   display ---z3

# Z0 – links vorne (MOTOR2_1)
[stepper_z]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 40.0
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
homing_positive_dir: false
position_max: 270
position_min: -15
homing_speed: 15
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PE1
interpolate: false
run_current: 1.2
hold_current: 0.2
sense_resistor: 0.110
stealthchop_threshold: 0

# Z1 – links hinten (MOTOR3)
[stepper_z1]
step_pin: PE6
dir_pin: !PA14
enable_pin: !PE0
rotation_distance: 40.0
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PD3
interpolate: false
run_current: 1.2
hold_current: 0.2
sense_resistor: 0.110
stealthchop_threshold: 0

# Z2 – rechts hinten (MOTOR4)
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40.00
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 1.2
hold_current: 0.2
sense_resistor: 0.110
stealthchop_threshold: 0

# Z3 – rechts vorne (MOTOR5)
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40.0
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 1.2
hold_current: 0.2
sense_resistor: 0.110
stealthchop_threshold: 0

# ------------------------------ Heizbett ------------------------------------
[heater_bed]
heater_pin: PA3
sensor_pin: PF3
sensor_type: NTC 100K MGB18-104F39050L32
min_temp: 0
max_temp: 115
max_power: 0.8
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

# ------------------------------- Lüfter -------------------------------------
[heater_fan Gehäuse_Lüfter_2] #Linker Controller Lüfter
pin: PE5
shutdown_speed: 0.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 50
fan_speed: 1.0

[heater_fan Gehäuse_Lüfter_1] #Rechter Controller Lüfter
pin: PA8
shutdown_speed: 0.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 50
fan_speed: 1.0

# [heater_fan BTT_Octopus_Lüfter] #Rechter Controller Lüfter
# pin: PD15
# kick_start_time: 0.5
# fan_speed: 1.0

[controller_fan BTT_Octopus_Lüfter]
pin:PD15
max_power:1
shutdown_speed:0
#cycle_time:
#hardware_pwm:
#kick_start_time:
#off_below:
#tachometer_pin:
#tachometer_ppr:
#tachometer_poll_interval:
#enable_pin:
#   See the "fan" section for a description of the above parameters.
fan_speed: 1.0
#   The fan speed (expressed as a value from 0.0 to 1.0) that the fan
#   will be set to when a heater or stepper driver is active.
#   The default is 1.0
idle_timeout:300
#   The amount of time (in seconds) after a stepper driver or heater
#   was active and the fan should be kept running. The default
#   is 30 seconds.
idle_speed:0.5
#   The fan speed (expressed as a value from 0.0 to 1.0) that the fan
#   will be set to when a heater or stepper driver was active and
#   before the idle_timeout is reached. The default is fan_speed.

stepper: stepper_z,stepper_z1,stepper_z2,stepper_z3,stepper_x,stepper_y
#   Name of the config section defining the heater/stepper that this fan
#   is associated with. If a comma separated list of heater/stepper names
#   is provided here, then the fan will be enabled when any of the given
#   heaters/steppers are enabled. The default heater is "extruder", the
#   default stepper is all of them.



[output_pin nevermore]
pin: PD14
value: 0
shutdown_value: 0

[temperature_fan BTT_pi_Lüfter]
pin: PD13
kick_start_time: 0.8
off_below: 0.1
max_power: 1.0
sensor_type: temperature_host
control: pid
min_temp: 0
max_temp: 85
pid_kp: 1.0
pid_ki: 0.5
pid_kd: 2.0
min_speed: 0.1
max_speed: 1
target_temp: 38

# [output_pin caselight]
# pin: PD12
# value: 0
# shutdown_value: 0

[output_pin caselight]
# Chamber Lighting - HE3 Connector (Optional)
pin: PD12
shutdown_value: 0
value: 1.0
# with 0.0002 the min is 5%. 7% seems like a good idle state. 40% for prints. over 60% to 100% all seems to be same brightness
# with 0.0001 the min is 9%. 12% seems like a good idle state. over 60% to 100% all seems to be same brightness


# --------------------------- Filament-/IO‑Pins -------------------------------
[duplicate_pin_override]
pins: PG10

# [filament_switch_sensor Nodge]
# switch_pin: ^PG10

# ------------------------------ Sonstiges -----------------------------------
[rounded_path]
resolution: 0.2
replace_g0: False

# [output_pin caselight]
# pin: PB10
# pwm: true
# shutdown_value: 0
# value: 1
# cycle_time: 0.01

[idle_timeout]
timeout: 1800

[firmware_retraction]
#   G10 für Retract and G11 Deretract
retract_length: 1.5
#   Die Laenge des Rueckzuges in mm wenn ein G10 Befehl angesteuert wird.
#   Ebenfalls wenn nicht weiter definiert gilt er für den Deretract G11.
#   Die Standardeinstellung ist 0mm.
retract_speed: 40
#   Rueckzugsgeschwindigkeit in mm/s. Der Standardwert ist 20 mm/s.
#unretract_extra_length: 0
#   Hier wird die zusaetzliche Laenge (in mm) definiert, die bei einem Derretract
#   gemacht werden soll.
unretract_speed: 40
#   Die Geschwindigkeit für einen Deretract in mm/s. Der Standardwert ist 10 mm/s.

# Bed Mesh – in „eddy-ng.cfg" aktiv. Hier ggf. AUSKOMMENTIERT lassen, um Doppelbelegung zu vermeiden.
# [bed_mesh]
# ...

# UI / Mainsail
[display_status]
[exclude_object]
[pause_resume]
[virtual_sdcard]
path: /home/biqu/printer_data/gcodes
on_error_gcode: CANCEL_PRINT
[save_variables]
filename:  ~/variables.cfg
[gcode_arcs]
resolution: 0.1

# Quad Gantry Level – in „eddy-ng.cfg" aktiv. Hier deaktiviert lassen.
# [quad_gantry_level]
# ...

# Achsenverwinden-Kompensation (kann aktiv bleiben; nach sauberem QGL nutzen)
[axis_twist_compensation]
