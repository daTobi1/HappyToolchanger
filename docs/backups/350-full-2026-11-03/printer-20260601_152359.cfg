# ============================================================================
# Hauptkonfiguration (Hardware, Achsen, Heater, Lüfter, etc.)
# QGL, Bed Mesh, Eddy-NG Probe & Homing-Makros: siehe eddy_probe.cfg
# ============================================================================

[include mainsail.cfg]
[include happy_toolchanger.cfg]
#[include update_macros.cfg]
[include toolchanger/readonly-configs/toolchanger-include.cfg]
[include eddy-ng.cfg]
[include macros/tobi-macros.cfg]
[include HEXA.cfg]

# ---------------------- Client-/Mainsail-Variablen ---------------------------
[gcode_macro _CLIENT_VARIABLE]
variable_clean_temp_offset: 20
variable_clean_temp: 200
variable_use_custom_pos   : True
variable_custom_park_x    : 315.0
variable_custom_park_y    : 315.0
variable_custom_park_dz   : 2.0
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : 315.0
variable_park_at_cancel_y : 315.0
gcode:

# ------------------------------- MCU ----------------------------------------
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_33001F000251313133353932-if00

# --------------------------- Druckerkinematik -------------------------------
[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
max_z_velocity: 150
max_z_accel: 7000
square_corner_velocity: 5.0

[force_move]
enable_force_move: True

[offset]

# -------------------------------------------------
# Nozzle Offset Calibration (Z-Switch)
# -------------------------------------------------
pin: PG10
zswitch_x_pos: 79.90
zswitch_y_pos: -7.70
zswitch_z_pos: 1.83
lift_z: 5.0
safe_start_z: 7.0
move_speed: 80
z_move_speed: 6
samples: 5
samples_tolerance: 0.005
samples_max_count: 20
z_calc_method: trimmed
z_trim_count: 1
recover_lift_mm: 3.0
recover_pause_ms: 150
recover_max_attempts: 4

start_gcode:
  M118 Starting calibration
  G28
  QUAD_GANTRY_LEVEL
  G28 Z

before_pickup_gcode:
  M118 Before pickup

after_pickup_gcode:
  M118 After pickup

finish_gcode:
  M118 Calibration complete
  T0

[gcode_macro AUSRICHTUNG_NOZZLECAM]
description: Nozzle reinigen und zur Ausrichtposition für die Nozzlecam fahren
gcode:
  {% if not printer.toolhead.homed_axes %}
    G28
  {% endif %}
  CLEAN_NOZZLE
  G90
  G0 Z35 F4000
  G0 X18.045 Y10.100 F6000

# ------------------------------- Sensoren -----------------------------------
[temperature_sensor MCU]
sensor_type: temperature_mcu

# ------------------------------ Achsen XY -----------------------------------
#   B(X) --------- A(Y)
#   |                |
#   |--------E-------|
#   |                |
#   |                |

# X-Achse – MOTOR_0 (B-Motor)
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 32
rotation_distance: 39.70
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 80
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: true
run_current: 1.2
hold_current: 0.2
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PG6
driver_SGTHRS: 110


# Y-Achse – MOTOR_1 (A-Motor)
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 32
rotation_distance: 39.70
full_steps_per_rotation: 200
endstop_pin: !PG9
position_min: -100
position_endstop: 330
position_max: 330
homing_speed: 100
second_homing_speed: 15
homing_retract_dist: 10
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: true
run_current: 1.2
hold_current: 0.2
sense_resistor: 0.110
stealthchop_threshold: 0

# --------------------------- Z-Gantry (4 Motoren) ----------------------------
#   z1 -------------- z2
#   |                 |
#   |                 |
#   |                 |
#   |                 |
#  z0---   display ---z3

# Z0 – links vorne (MOTOR2_1)
[stepper_z]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 40.00
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 365
position_min: -100
homing_speed: 15
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PE1
interpolate: false
run_current: 1.2
hold_current: 0.2
sense_resistor: 0.110
stealthchop_threshold: 0

# Z1 – links hinten (MOTOR3)
[stepper_z1]
step_pin: PE6
dir_pin: !PA14
enable_pin: !PE0
rotation_distance: 40.00
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PD3
interpolate: false
run_current: 1.2
hold_current: 0.2
sense_resistor: 0.110
stealthchop_threshold: 0

# Z2 – rechts hinten (MOTOR4)
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40.00
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 1.2
hold_current: 0.2
sense_resistor: 0.110
stealthchop_threshold: 0

# Z3 – rechts vorne (MOTOR5)
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40.00
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 1.2
hold_current: 0.2
sense_resistor: 0.110
stealthchop_threshold: 0

# ------------------------------ Heizbett ------------------------------------
[heater_bed]
heater_pin: PA3
sensor_pin: PF3
sensor_type: NTC 100K MGB18-104F39050L32
min_temp: 0
max_temp: 115
max_power: 0.8

# ------------------------------- Lüfter -------------------------------------
[heater_fan controller_fan_1]
pin: PD13
shutdown_speed: 0.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 50
fan_speed: 1.0

[heater_fan controller_fan_2]
pin: PD12
shutdown_speed: 0.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 50
fan_speed: 1.0

[heater_fan controller_fan_3]
pin: PD15
shutdown_speed: 0.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 50
fan_speed: 1.0

[controller_fan BTT_Octopus_Lüfter]
pin: PA8
max_power: 1
shutdown_speed: 0.0
fan_speed: 1.0
idle_timeout: 30
idle_speed: 0.5
stepper: stepper_z,stepper_z1,stepper_z2,stepper_z3,stepper_x,stepper_y

[output_pin nevermore]
pin: PE5
value: 0
shutdown_value: 0

# ------------------------------ Sonstiges -----------------------------------
[rounded_path]
resolution: 0.2
replace_g0: False

[output_pin caselight]
pin: PB10
pwm: true
shutdown_value: 0
value: 1
cycle_time: 0.01

[idle_timeout]
timeout: 1800

[firmware_retraction]
retract_length: 1.5
retract_speed: 40
unretract_speed: 40

# UI / Mainsail
[display_status]
[exclude_object]
[pause_resume]

[virtual_sdcard]
path: /home/biqu/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[save_variables]
filename: ~/variables.cfg

[gcode_arcs]
resolution: 0.1

[axis_twist_compensation]
speed: 50
horizontal_move_z: 10
calibrate_start_x: 20
calibrate_end_x: 300
calibrate_y: 112.5
calibrate_start_y: 20
calibrate_end_y: 300

