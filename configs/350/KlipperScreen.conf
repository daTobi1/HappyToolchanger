# KlipperScreen Configuration for HappyToolchanger 350
# 6-Tool Toolchanger Printer

[main]
use_default_menu: False

[printer HappyToolchanger350]
titlebar_items: heater_bed, MCU, Pi, spool
titlebar_name_type: full
extrude_distances: 5, 10, 25, 50
extrude_speeds: 1, 2, 5, 25
move_distances: 0.1, 0.5, 1, 5, 10, 25, 50

# --- Preheat Presets ---

[preheat PLA]
extruder: 210
heater_bed: 60

[preheat PETG]
extruder: 240
heater_bed: 80

[preheat ABS/ASA]
extruder: 250
heater_bed: 110

[preheat TPU]
extruder: 230
heater_bed: 50

[preheat Nylon/PA]
extruder: 260
heater_bed: 100

[preheat cooldown]
gcode: M107

# --- Main Menu (2x4 Grid) ---

[menu __main tools]
name: Tools
icon: extruder

[menu __main print]
name: Print
icon: print
panel: gcodes

[menu __main preheat]
name: Preheat
icon: heat-up
panel: preheat

[menu __main extrude]
name: Extrude
icon: filament
panel: extrude

[menu __main wartung]
name: Wartung
icon: settings

[menu __main spoolman]
name: Spoolman
icon: filament
panel: spoolman

[menu __main system]
name: System
icon: info

# --- Tools Submenu: T0 ---

[menu __main tools T0]
name: T0
icon: extruder

[menu __main tools T0 activate]
name: Aktivieren (Dock)
icon: home
method: printer.gcode.script
params: {"script":"T0"}
confirm: Tool T0 aktivieren (Dock/Undock)?

[menu __main tools T0 load]
name: Filament laden
icon: arrow-down
method: printer.gcode.script
params: {"script":"HTC_LOAD_FILAMENT T=0"}

[menu __main tools T0 unload]
name: Filament entladen
icon: arrow-up
method: printer.gcode.script
params: {"script":"HTC_UNLOAD_FILAMENT T=0"}

[menu __main tools T0 extrude5]
name: Extrude 5mm
icon: filament
method: printer.gcode.script
params: {"script":"HTC_EXTRUDE T=0 E=5"}

[menu __main tools T0 extrude10]
name: Extrude 10mm
icon: filament
method: printer.gcode.script
params: {"script":"HTC_EXTRUDE T=0 E=10"}

[menu __main tools T0 extrude25]
name: Extrude 25mm
icon: filament
method: printer.gcode.script
params: {"script":"HTC_EXTRUDE T=0 E=25"}

[menu __main tools T0 retract5]
name: Retract 5mm
icon: filament
method: printer.gcode.script
params: {"script":"HTC_RETRACT T=0 E=5"}

[menu __main tools T0 retract10]
name: Retract 10mm
icon: filament
method: printer.gcode.script
params: {"script":"HTC_RETRACT T=0 E=10"}

[menu __main tools T0 retract25]
name: Retract 25mm
