# This file contains common pin mappings for the BIGTREETECH EBBT0
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBT0]
canbus_uuid: 5c1c6af1a195
# python3 ~/katapult/scripts/flashtool.py -i can0 -u ac5f7df1a805 -r
# python3 ~/katapult/scripts/flashtool.py -i can0 -u ac5f7df1a805 -f ~/klipper/out/klipper.bin

[lis2dw lis2dw_T0]
cs_pin: EBBT0: gpio12
spi_software_sclk_pin: EBBT0: gpio2
spi_software_mosi_pin: EBBT0: gpio3
spi_software_miso_pin: EBBT0: gpio4
axes_map: x,z,-y

[extruder]
step_pin: EBBT0: gpio7
dir_pin:  EBBT0: gpio6
enable_pin: !EBBT0: gpio14
heater_pin: EBBT0: gpio23
sensor_pin: EBBT0: gpio27
sensor_type: ATC Semitec 104NT-4-R025H42G

full_steps_per_rotation: 200
microsteps: 16
#gear_ratio: 9:1
rotation_distance: 4.72
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.025
pressure_advance_smooth_time: 0.03
min_extrude_temp: 180

control: pid
pid_Kp: 41.530   #44.282 
pid_Ki: 10.649  #18.451 
pid_Kd: 40.492

min_temp: 0
max_temp: 300

max_extrude_cross_section: 999
max_extrude_only_distance: 500
max_extrude_only_velocity: 120

[tmc2209 extruder]
uart_pin: EBBT0: gpio15
run_current: 0.85
hold_current: 0.100
interpolate: true
sense_resistor: 0.110
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4
stealthchop_threshold: 0

[heater_fan T0_hotend_fan]
pin: EBBT0: gpio21
heater: extruder
heater_temp: 50.0

[fan_generic T0_partfan]
pin: EBBT0: gpio13

[gcode_macro T0]
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=0


#change the tool numbers to the tool you are configuring, ie T0, T1, etc
[tool T0]
#change this too
tool_number: 0
# detection_pin entfernt - Pin wird jetzt von tool_probe genutzt
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
#if this were T1, then this would be extruder1, etc
extruder: extruder
#Change T0_partfan to tool number
fan: T0_partfan
#These are build specific, its where the tool is sititng in it's dock.
#*# params_park_x = 4.5
#*# params_park_y = -11.70
#*# params_park_z = 355.00
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 46.4
params_input_shaper_damping_ratio_x: 0.098
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 34.4
params_input_shaper_damping_ratio_y: 0.088

#

# [gcode_macro _T0_vars]
# variable_logo_led_name:         "T0_leds"
# variable_logo_idx:              "1"
# variable_nozzle_led_name:       "T0_leds"
# variable_nozzle_idx:            "2,3"
# gcode:



[tool_probe T0]
pin: ^EBBT0:gpio22
z_probe: probe_eddy_ng my_eddy
#z_probe_home: probe_eddy_ng my_eddy  # Z-Homing: Eddy (kein Aufheizen)
#z_probe_qgl: none                     # QGL: Tap
#z_probe_mesh: probe_eddy_ng my_eddy  # Bed Mesh: Eddy (Scanning)
tool: 0
x_offset: 0
y_offset: 0
z_offset: 0
speed: 3.0
lift_speed: 10.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.05
samples_tolerance_retries: 5
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder
deactivate_gcode:
    _TAP_PROBE_DEACTIVATE HEATER=extruder

# QGL Probe-Auswahl fuer T0 (tap oder eddy)
[gcode_macro _T0_QGL]
variable_coarse_probe: "eddy"
variable_fine_probe: "eddy"
gcode:
  {action_respond_info("T0 QGL: coarse=%s fine=%s" % (printer["gcode_macro _T0_QGL"].coarse_probe, printer["gcode_macro _T0_QGL"].fine_probe))}
