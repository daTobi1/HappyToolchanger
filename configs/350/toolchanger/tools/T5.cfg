# This file contains common pin mappings for the BIGTREETECH EBBCan
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu et5]
canbus_uuid: 99aec1a00207

[temperature_sensor SHT36T5_mcu]
sensor_type: temperature_mcu
sensor_mcu: et5

[extruder5]
step_pin: et5:gpio7
dir_pin: et5:gpio6
enable_pin: !et5:gpio14
heater_pin: et5:gpio23
sensor_type: Generic 3950
sensor_pin: et5:gpio27

min_temp: -10
max_temp: 300
min_extrude_temp: 180
pressure_advance: 0.025 #0.031                #to be calibrated
pressure_advance_smooth_time: 0.03 #to be calibrated
max_power: 1.0
max_extrude_cross_section: 999
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
max_extrude_only_accel: 10000
full_steps_per_rotation: 200
microsteps: 16
rotation_distance: 4.72
nozzle_diameter: 0.400
filament_diameter: 1.750
nozzle_diameter: 0.400

control: pid
pid_kp: 38
pid_ki: 9
pid_kd: 12

[tmc2209 extruder5]
uart_pin: et5:gpio15
run_current: 0.85
hold_current: 0.100
interpolate: true
#hold_current: 0.1
#driver_TPOWERDOWN: 20
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[fan_generic T5_partfan]
pin: et5:gpio13

[heater_fan T5_hotend_fan]
pin: et5:gpio21
heater: extruder5
heater_temp: 50.0

[lis2dw lis2dw_T5] 
cs_pin: et5:gpio12
spi_software_sclk_pin: et5:gpio2
spi_software_mosi_pin: et5:gpio3
spi_software_miso_pin: et5:gpio4
axes_map: x,z,y



[gcode_macro T5]
variable_color: ""
gcode:
  SELECT_TOOL T=5

[tool T5]
tool_number: 5
extruder: extruder
fan: T5_partfan
params_park_x: 345.50
params_park_y: -9.00
params_park_z: 352.00
gcode_x_offset: -1.060
gcode_y_offset: 2.190
gcode_z_offset: -0.794

# detection_pin entfernt - Pin wird jetzt von tool_probe genutzt

params_input_shaper_type_x: 'ei'
params_input_shaper_freq_x: 50.2
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'zv'
params_input_shaper_freq_y: 38.8
params_input_shaper_damping_ratio_y: 0.01

# deadband: 2

[tool_probe T5]
pin: ^et5:gpio22
#z_probe: probe_eddy_ng my_eddy       # Default: Eddy fuer alles
#z_probe_home: probe_eddy_ng my_eddy  # Z-Homing: Eddy (kein Aufheizen)
#z_probe_qgl: none                     # QGL: Tap
#z_probe_mesh: probe_eddy_ng my_eddy  # Bed Mesh: Eddy (Scanning)
tool: 5
x_offset: 0
y_offset: 0
z_offset: -0.623	
speed: 3.0
lift_speed: 10.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.05
samples_tolerance_retries: 5
# activate/deactivate einmal je Probe-Session statt je Sample -
# sonst wuerde _TAP_PROBE_DEACTIVATE zwischen den Samples abkuehlen
# und _TAP_PROBE_ACTIVATE direkt wieder aufheizen.
deactivate_on_each_sample: False
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder5
deactivate_gcode:
    _TAP_PROBE_DEACTIVATE HEATER=extruder5

#*# [input_shaper]
#*# shaper_type_x = ei
#*# shaper_freq_x = 50.2
#*# shaper_type_y = zv
#*# shaper_freq_y = 38.8



