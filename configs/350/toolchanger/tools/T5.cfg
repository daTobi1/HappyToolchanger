# QGL Probe-Auswahl fuer T5 (tap oder eddy)
[gcode_macro _T5_QGL]
variable_coarse_probe: "tap"
variable_fine_probe: "tap"
gcode:
  {action_respond_info("T5 QGL: coarse=%s fine=%s" % (printer["gcode_macro _T5_QGL"].coarse_probe, printer["gcode_macro _T5_QGL"].fine_probe))}
