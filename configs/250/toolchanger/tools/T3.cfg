       # if you want to use this file in your actual tool changer then remove the `example_` from the filename.

# This file contains common pin mappings for the BIGTREETECH EBBT1
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBT3]
canbus_uuid: 8d0f9f625a9c
# python3 ~/katapult/scripts/flashtool.py -i can0 -u 8170dfa83388 -r
# python3 ~/katapult/scripts/flashtool.py -i can0 -u 8170dfa83388 -f ~/klipper/out/klipper.bin

[adxl345 adxl1345_T3]
cs_pin: EBBT3: PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[temperature_sensor EBB36T3_mcu]
sensor_type: temperature_mcu
sensor_mcu: EBBT3

[extruder3]
step_pin: EBBT3: PD0
dir_pin: EBBT3: PD1
enable_pin: !EBBT3: PD2
heater_pin: EBBT3: PB13
sensor_pin: EBBT3: PA3
sensor_type: Generic 3950

min_temp: -10
max_temp: 300
min_extrude_temp: 180
pressure_advance: 0.027 #0.031                #to be calibrated
pressure_advance_smooth_time: 0.03 #to be calibrated
max_power: 1.0
max_extrude_cross_section: 999
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
max_extrude_only_accel: 10000
full_steps_per_rotation: 200
microsteps: 16
rotation_distance: 4.68 #--> 3% kleiner als #4.82 #4.60 
nozzle_diameter: 0.400
filament_diameter: 1.750
nozzle_diameter: 0.400

control: pid
pid_kp: 41.361
pid_ki: 16.220
pid_kd: 26.368

[tmc2209 extruder3]
uart_pin: EBBT3:PA15
run_current: 0.85
hold_current: 0.100
interpolate: true
#hold_current: 0.1
#driver_TPOWERDOWN: 20
sense_resistor: 0.110
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[heater_fan T3_hotend_fan]
pin: EBBT3:PA1
heater: extruder3
heater_temp: 50.0
kick_start_time: 0.5

[fan_generic T3_partfan]
pin: EBBT3:PA0

# Commented out - HappyToolchanger handles T-macros now
#[gcode_macro T3]
#variable_active: 0
#variable_color: ""
#gcode:
#    SELECT_TOOL T=3
#   



#change the tool numbers to the tool you are configuring, ie T1, T1, etc
[tool T3]
tool_number: 3
extruder: extruder3
fan: T3_partfan
params_park_x: 229.50
params_park_y: -18.00
params_park_z: 257.5
gcode_x_offset: -0.18
gcode_y_offset: -5.84
gcode_z_offset: -0.183
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 53.4
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 41.8
params_input_shaper_damping_ratio_y: 0.01 
# detection_pin entfernt - Pin wird jetzt von tool_probe genutzt

#shaper_type_y = mzv, shaper_freq_y = 52.4 Hz
#Recommended shaper_type_x = mzv, shaper_freq_x = 51.6 Hz

# [tool_probe T1]
# pin: ^EBBT1:PC15
# tool: 1
# x_offset: 0 # X axis-sensor relative nozzle offset
# y_offset: 0 # Y axis-sensor relative nozzle offset
# z_offset = 0 # Z axis-sensor relative nozzle offset
# # drop_first_result: True # enable is on danger-klipper
# speed: 5.0
# samples: 3
# samples_result: median
# sample_retract_dist: 5.0
# samples_tolerance: 0.025
# samples_tolerance_retries: 10
# activate_gcode:
#     _TAP_PROBE_ACTIVATE HEATER=extruder1

# [filament_switch_sensor filament_sensor_T1]
# switch_pin: EBBT1:PA1
# pause_on_runout: FALSE
# runout_gcode:
#   M117 Runout sensor AVR0 reports: Runout
#   SET_GCODE_VARIABLE MACRO=T1 VARIABLE=filament_consumed VALUE=1
# insert_gcode:
#   M117 Runout sensor AVR0 reports: Filament Detected
#   SET_GCODE_VARIABLE MACRO=T1 VARIABLE=filament_consumed VALUE=0
[tool_probe T3]
pin: ^EBBT3:PB8
#z_probe: probe_eddy_ng my_eddy       # Default: Eddy fuer alles
#z_probe_home: probe_eddy_ng my_eddy  # Z-Homing: Eddy (kein Aufheizen)
#z_probe_qgl: none                     # QGL: Tap
#z_probe_mesh: probe_eddy_ng my_eddy  # Bed Mesh: Eddy (Scanning)
tool: 3
x_offset: 0
y_offset: 0
z_offset: -0.466
speed: 3.0
lift_speed: 10.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.05
samples_tolerance_retries: 5
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder3
deactivate_gcode:
    _TAP_PROBE_DEACTIVATE HEATER=extruder3

# QGL Probe-Auswahl fuer T3 (tap oder eddy)
[gcode_macro _T3_QGL]
variable_coarse_probe: "tap"
variable_fine_probe: "tap"
gcode:
  {action_respond_info("T3 QGL: coarse=%s fine=%s" % (printer["gcode_macro _T3_QGL"].coarse_probe, printer["gcode_macro _T3_QGL"].fine_probe))}
