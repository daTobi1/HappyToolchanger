[main]
use_default_menu: False
show_cursor: True

[printer HappyToolchanger250]
titlebar_items: heater_bed, MCU, Pi, spool
titlebar_name_type: full
extrude_distances: 5, 10, 25, 50
extrude_speeds: 1, 2, 5, 25
move_distances: 0.1, 0.5, 1, 5, 10, 25, 50

[preheat PLA]
extruder: 210
heater_bed: 60

[preheat PETG]
extruder: 240
heater_bed: 80

[preheat ABS/ASA]
extruder: 250
heater_bed: 110

[preheat TPU]
extruder: 230
heater_bed: 50

[preheat Nylon/PA]
extruder: 260
heater_bed: 100

[preheat cooldown]
gcode: M107

