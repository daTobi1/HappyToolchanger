# ==============================================================================
# Wartung Submenu
# ==============================================================================

[menu __main wartung clean]
name: Clean Nozzle
icon: shuffle
method: printer.gcode.script
params: {"script":"CLEAN_NOZZLE"}

[menu __main wartung cleanall]
name: Clean All Nozzles
icon: shuffle
method: printer.gcode.script
confirm:
    Are you sure you want to clean ALL nozzles? This will pick up each tool in sequence.
params: {"script":"CLEAN_ALL_NOZZLES"}

[menu __main wartung demo]
name: Tool Demo
icon: refresh
method: printer.gcode.script
confirm:
    Run tool change demo? This will cycle through all tools.
params: {"script":"TOOL_DEMO"}

[menu __main wartung nozzlecal]
name: Nozzle Calibrate
icon: z-tilt
method: printer.gcode.script
confirm:
    Run nozzle offset calibration? Make sure the Z-switch is installed.
params: {"script":"CALIBRATE_NOZZLE_OFFSETS"}

[menu __main wartung qgl]
name: QGL
icon: z-tilt
method: printer.gcode.script
params: {"script":"QUAD_GANTRY_LEVEL"}

[menu __main wartung offsets]
name: Calibrate Offsets
icon: z-tilt
method: printer.gcode.script
confirm:
    Run full offset calibration? Make sure the Z-switch is installed.
params: {"script":"CALIBRATE_OFFSETS"}

[menu __main wartung unloadone]
name: Unload Filament
icon: arrow-up
method: printer.gcode.script
params: {"script":"HTC_UNLOAD_FILAMENT"}

[menu __main wartung unloadall]
name: Unload All
icon: arrow-up
method: printer.gcode.script
confirm:
    Unload filament from ALL tools?
params: {"script":"HTC_UNLOAD_ALL"}

[menu __main wartung zswitch]
name: Z-Switch Enable
icon: home-z
method: printer.gcode.script
enable: {{ printer.save_variables.variables.zswitch_installed is defined and not printer.save_variables.variables.zswitch_installed }}
params: {"script":"SET_GCODE_VARIABLE MACRO=_HTC_VARS VARIABLE=zswitch_installed VALUE=1"}

[menu __main wartung emergencyhome]
name: Emergency Home
icon: emergency
method: printer.gcode.script
enable: {{ not printer.idle_timeout.state == 'Printing' }}
params: {"script":"EMERGENCY_HOME"}

