########################################################################################################################
# HappyToolchanger Configuration
#
# Standalone extension for toolchanger printers.
# Adds Endless Spool, filament sensors, statistics, and Spoolman support.
#
# Works alongside klipper-toolchanger-easy (KTC) or similar software.
# KTC handles physical docking/undocking — HappyToolchanger adds intelligence on top.
#
# Documentation: https://github.com/daTobi1/HappyToolchanger
########################################################################################################################

[happy_toolchanger]
# Number of tools on the toolchanger (1-16)
num_tools: 4

# GCode command to execute for physical tool change.
# {tool} is replaced with the gate number.
tool_change_command: SELECT_TOOL T={tool}

# Endless Spool: automatic failover on filament runout.
# Tools in the same group can substitute for each other.
# Example: T0+T2 in group 0, T1+T3 in group 1
endless_spool_enabled: 0
#endless_spool_groups: 0, 1, 0, 1

# Gate metadata (optional — can also come from Spoolman)
#gate_colors: red, blue, green, yellow
#gate_materials: PLA, PLA, PLA, PLA
#gate_temperatures: 210, 210, 210, 210
#gate_filament_names: Tool0, Tool1, Tool2, Tool3

# Spoolman integration: off | sync
spoolman_support: sync

# Spoolman location tracking — updates spool location on load/unload
# printer_name is used in the location string, e.g. "Voron 250 - T0"
printer_name: Voron 250
# Spoolman server URL (fallback if Moonraker doesn't provide it)
spoolman_server: http://192.168.178.54:7912
# Location to set when a spool is unloaded (empty = clear location)
#default_location: Lager

# Logging: 0=minimal, 1=normal, 2=verbose
log_level: 1

# Sensor debounce time in seconds (how long filament must be absent before runout triggers)
sensor_debounce_time: 1.0


# FILAMENT SENSORS
[htc_sensors]
# Pre-gate filament sensors — one per tool for runout detection.
# Mikroschalter an den Hexa-Ports IO.7-IO.10 (4,7k Pull-up auf dem Board,
# 3,3 V, NICHT 5V-tolerant). Verdrahtung COM + NO gegen GND:
# Filament drueckt den Schalter -> Pin LOW -> mit "!" = vorhanden.
# Keinen [filament_switch_sensor] auf dieselben Pins legen (Pin-Konflikt).
sensor_pin_0: ^!hexa:PB1         # T0 - IO.7
sensor_pin_1: ^!hexa:PB0         # T1 - IO.8
sensor_pin_2: ^!hexa:PA7         # T2 - IO.9
sensor_pin_3: ^!hexa:PA6         # T3 - IO.10


# T-MACROS
# These route through HappyToolchanger for Endless Spool support.
# IMPORTANT: Comment out existing T0-T3 macros in your KTC tool configs!
# The [tool T0] sections and all KTC logic remain untouched.
#
[gcode_macro T0]
gcode: HTC_CHANGE_TOOL TOOL=0
variable_color: ""
variable_spool_id: -1

[gcode_macro T1]
gcode: HTC_CHANGE_TOOL TOOL=1
variable_color: ""
variable_spool_id: -1

[gcode_macro T2]
gcode: HTC_CHANGE_TOOL TOOL=2
variable_color: ""
variable_spool_id: -1

[gcode_macro T3]
gcode: HTC_CHANGE_TOOL TOOL=3
variable_color: ""
variable_spool_id: -1

