[gcode_macro INITIALISIERUNG_NOZZLEKALIBRIERUNG]
description: Entläd alle Druckköpfe und Reinigt nacheinander alle verfügbaren Nozzles (T0–T4)
gcode:
 UNLOAD_ALL_FILAMENT
 CLEAN_ALL_NOZZLES

[gcode_macro CLEAN_ALL_NOZZLES]
description: Reinigt nacheinander alle verfügbaren Nozzles (T0–T4)
gcode:
  {% set tools = [0, 1, 2, 3] %}   # Anpassen, falls du weniger/mehr Tools hast

  {% if not printer.toolhead.homed_axes %}
    G28
  {% endif %}

  G90

  {% for t in tools %}
    M118 Starte Reinigung für Tool T{t}

    T{t}
    RESPOND PREFIX="CLEAN" MSG="Reinige Nozzle von T{t}"

    CLEAN_NOZZLE

    G4 P300
  {% endfor %}

  M118 Alle Nozzles fertig gereinigt!

[delayed_gcode STOP_NEVERMORE]
gcode:
  SET_PIN PIN=nevermore VALUE=0.00
  M118 Nevermore-Filter gestoppt

# ============================================================================
#  NOTFALL Z-HOMING (wenn Tool ohne Eddy-Probe geladen ist)
# ============================================================================

[gcode_macro EMERGENCY_HOME_Z]
description: Notfall-Homing: Z ueber Switch referenzieren, auf T0 wechseln, richtig homen.
  Funktioniert mit JEDEM geladenen Tool.
gcode:
  {% set tool_nr = printer.toolchanger.tool_number|default(-1)|int %}

  {% if tool_nr == 0 %}
    M118 T0 ist bereits geladen - normales Homing!
    G28
  {% elif tool_nr < 0 %}
    M118 FEHLER: Kein Tool geladen! Bitte zuerst manuell ein Tool aufnehmen.
  {% else %}
    M118 ============================================
    M118 NOTFALL-HOMING: T{tool_nr} aktiv (kein Probe)
    M118 ============================================

    # 1) Alles homen — Z geht ueber PG10 Switch (homing_override)
    M118 Schritt 1/4: Homing ueber Z-Switch...
    G28

    # 2) Auf T0 wechseln (Toolchanger faehrt selbst auf Dock-Hoehe)
    M118 Schritt 2/4: Wechsle auf T0...
    T0

    # 3) Nochmal Z homen — jetzt mit T0 (korrekter Switch-Offset fuer T0)
    M118 Schritt 3/4: Re-Homing mit T0 am Switch...
    G28 Z

    # 4) PROBE_EDDY_NG_TAP fuer praezises Z
    M118 Schritt 4/4: Eddy TAP fuer praezises Z...
    G90
    G0 X125 Y99 Z10 F5000
    PROBE_EDDY_NG_TAP
    G0 Z10 F3000

    M118 ============================================
    M118 NOTFALL-HOMING abgeschlossen! Z ist praezise.
    M118 Fuer volle Kalibrierung: HOMING_ROUTINE ausfuehren
    M118 ============================================
  {% endif %}

# ============================================================================
#  Z-SWITCH KALIBRIERUNG (position_endstop bestimmen)
# ============================================================================

[gcode_macro CALIBRATE_Z_SWITCH]
description: Kalibriert position_endstop fuer den Z-Switch.
  Misst Differenz zwischen Switch-Trigger und Bett via Eddy TAP.
  T0 MUSS geladen sein.
gcode:
  {% set tool_nr = printer.toolchanger.tool_number|default(-1)|int %}
  {% if tool_nr != 0 %}
    M118 FEHLER: T0 muss geladen sein! Aktuell: T{tool_nr}
  {% else %}
    M118 === Z-SWITCH KALIBRIERUNG ===
    M118 Schritt 1: Homing + QGL...
    G28
    QUAD_GANTRY_LEVEL

    M118 Schritt 2: Eddy TAP als Referenz (Bett = Z0)...
    G90
    G0 X125 Y99 Z10 F5000
    PROBE_EDDY_NG_TAP

    # Z-Position nach TAP merken
    SET_GCODE_VARIABLE MACRO=_CALIBRATE_Z_SWITCH_STEP2 VARIABLE=z_ref VALUE={printer.toolhead.position.z}

    M118 Schritt 3: Z-Switch anfahren und homen...
    G0 Z10 F3000
    G0 X29.85 Y0.98 F3000
    G28 Z
    G0 Z10 F3000

    M118 Schritt 4: Erneuter Eddy TAP zur Korrekturmessung...
    G0 X125 Y99 F5000
    PROBE_EDDY_NG_TAP

    # Korrektur berechnen
    _CALIBRATE_Z_SWITCH_STEP2
  {% endif %}

[gcode_macro _CALIBRATE_Z_SWITCH_STEP2]
variable_z_ref: 0.0
gcode:
  {% set z_after = printer.toolhead.position.z %}
  {% set z_ref = printer["gcode_macro _CALIBRATE_Z_SWITCH_STEP2"].z_ref %}
  {% set current_endstop = printer.configfile.settings['stepper_z'].position_endstop|float %}

  {% set target_z = 10.0 %}
  {% set correction = z_after - target_z %}
  {% set new_endstop = current_endstop + correction %}

  M118 ============================================
  M118 === Z-SWITCH KALIBRIERUNG ERGEBNIS ===
  M118 ============================================
  M118 Aktuell: position_endstop = {current_endstop}
  M118 Z nach TAP-Korrektur: {'%.4f'|format(z_after)} (erwartet: {target_z})
  M118 Abweichung: {'%.4f'|format(correction)} mm
  M118 NEUER position_endstop: {'%.4f'|format(new_endstop)}
  M118 ---
  {% if correction|abs < 0.01 %}
    M118 Kalibrierung ist korrekt! Keine Aenderung noetig.
  {% else %}
    M118 Zum Uebernehmen:
    M118   position_endstop in printer.cfg auf {'%.4f'|format(new_endstop)} setzen
  {% endif %}
  M118 ============================================

# ============================================================================

[gcode_macro UNSAFE_LOWER_BED]
description: Lower the bed 100mm without homing
gcode:
  G90
  SET_KINEMATIC_POSITION Z=100
  G0 Z0 F600
  M84

[gcode_macro UNSAFE_UPPER_BED]
description: Lower the bed 100mm without homing
gcode:
  G90
  SET_KINEMATIC_POSITION Z=-100
  G0 Z0 F600
  M84

[gcode_macro _TOOLCHANGER_TOOL_BEFORE_CHANGE]
gcode:
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT=1.20
  SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT=1.20
  SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT=1.20
  SET_TMC_CURRENT STEPPER=stepper_z3 CURRENT=1.20

